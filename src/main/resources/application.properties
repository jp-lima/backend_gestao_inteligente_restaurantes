spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase usa Postgres com RLS. O backend conecta como postgres/service_role
# (bypassa RLS). Nunca deixar o Hibernate recriar tabelas em produção.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT simples: só access token de 60 min. Troque via .env em cada ambiente.
jwt.secret=${JWT_SECRET:troque-por-uma-chave-de-32-bytes-ou-mais-0123456789}
